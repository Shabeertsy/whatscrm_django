services:
  api:
    image: evoapicloud/evolution-api:latest
    container_name: evolution_api
    restart: always
    ports:
      - "127.0.0.1:8080:8080" # Bound only to localhost (Reverse Proxy will forward to it)
    env_file:
      - .env.evolution
    environment:
      - SERVER_PORT=8080
      - SERVER_URL=${SERVER_URL}
      - AUTHENTICATION_API_KEY=${AUTHENTICATION_API_KEY}
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=${DATABASE_CONNECTION_URI}
      - DATABASE_CLIENT_NAME=evolution_db
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=${CACHE_REDIS_URI}
      - DEL_INSTANCE=false
      - STORE_MESSAGES=true
      - STORE_MESSAGE_UP=true
      - STORE_CONTACTS=true
      - STORE_CHATS=true
      - WEBHOOK_GLOBAL_ENABLED=false
      - QRCODE_LIMIT=30
    depends_on:
      evolution-postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - evolution-net

  frontend:
    container_name: evolution_frontend
    image: evoapicloud/evolution-manager:latest
    restart: always
    ports:
      - "127.0.0.1:3000:80"
    environment:
      - VITE_EVOLUTION_API_URL=${SERVER_URL}
      - VITE_EVOLUTION_API_KEY=${AUTHENTICATION_API_KEY}
    depends_on:
      - api
    networks:
      - evolution-net

  redis:
    container_name: evolution_redis
    image: redis:7-alpine
    restart: always
    command: redis-server --port 6379 --appendonly yes
    volumes:
      - evolution_redis_data:/data
    networks:
      evolution-net:
        aliases:
          - redis
          - evolution-redis

  evolution-postgres:
    container_name: evolution_postgres
    image: postgres:15-alpine
    restart: always
    command:
      - postgres
      - -c
      - max_connections=1000
    environment:
      - POSTGRES_DB=${POSTGRES_DATABASE}
      - POSTGRES_USER=${POSTGRES_USERNAME}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - evolution_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USERNAME} -d ${POSTGRES_DATABASE}"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks:
      evolution-net:
        aliases:
          - postgres
          - evolution-postgres

volumes:
  evolution_instances:
    name: evolution_instances
  evolution_redis_data:
    name: evolution_redis_data
  evolution_pg_data:
    name: evolution_pg_data

networks:
  evolution-net:
    name: evolution-net
    driver: bridge