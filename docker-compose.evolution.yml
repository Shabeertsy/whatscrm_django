services:
  api:
    image: evoapicloud/evolution-api:latest
    container_name: evolution_api
    restart: always
    ports:
      - "${EVOLUTION_PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env.evolution
    depends_on:
      evolution-postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - evolution-net

  frontend:
    container_name: evolution_frontend
    image: evoapicloud/evolution-manager:latest
    restart: always
    entrypoint: ["/bin/sh", "-c", "sed -i 's/must-revalidate //g' /etc/nginx/conf.d/nginx.conf && /start.sh"]
    ports:
      - "${EVOLUTION_MANAGER_PORT:-3000}:80"
    depends_on:
      - api
    networks:
      - evolution-net

  redis:
    container_name: evolution_redis
    image: redis:7-alpine
    restart: always
    command: redis-server --port 6379 --appendonly yes
    volumes:
      - evolution_redis_data:/data
    networks:
      evolution-net:
        aliases:
          - redis
          - evolution-redis

  evolution-postgres:
    container_name: evolution_postgres
    image: postgres:15-alpine
    restart: always
    command:
      - postgres
      - -c
      - max_connections=1000
      - -c
      - listen_addresses=*
    env_file:
      - .env.evolution
    environment:
      - POSTGRES_DB=${POSTGRES_DATABASE:-evolution_db}
      - POSTGRES_USER=${POSTGRES_USERNAME:-evolution}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-evolution_secret_password}
    volumes:
      - evolution_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USERNAME:-evolution} -d ${POSTGRES_DATABASE:-evolution_db}"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks:
      evolution-net:
        aliases:
          - postgres
          - evolution-postgres

volumes:
  evolution_instances:
    name: evolution_instances
  evolution_redis_data:
    name: evolution_redis_data
  evolution_pg_data:
    name: evolution_pg_data

networks:
  evolution-net:
    name: evolution-net
    driver: bridge